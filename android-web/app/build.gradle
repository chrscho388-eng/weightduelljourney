plugins {
    id "com.android.application"
}

android {
    namespace "de.weightplan.app"
    compileSdk 34

    defaultConfig {
        applicationId "de.weightplan.web"
        minSdk 26
        targetSdk 34
        // Every CI build gets a higher version so Android accepts it as an update.
        def build = (System.getenv("GITHUB_RUN_NUMBER") ?: "0").toInteger()
        versionCode 100 + build
        versionName "2." + build
    }

    signingConfigs {
        release {
            // Fixed key from the repo secrets keeps updates installable over the old app; falls back to the debug key.
            def ks = System.getenv("SIGNING_KEYSTORE_FILE")
            if (ks && new File(ks).exists()) {
                storeFile file(ks)
                storePassword System.getenv("SIGNING_PASSWORD")
                keyAlias "weightplan"
                keyPassword System.getenv("SIGNING_PASSWORD")
            } else {
                storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.browser:browser:1.8.0"
}
