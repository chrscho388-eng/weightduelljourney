name: Android-APK bauen

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "android-web/**"
      - "kurs.html"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: App-Seite in die APK legen
        run: |
          mkdir -p android/app/src/main/assets
          {
            printf '<!doctype html><html lang="de"><head><meta charset="utf-8">'
            printf '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
            printf '<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%%}[hidden]{display:none!important}</style>'
            printf '</head><body>'
            cat kurs.html
            printf '</body></html>'
          } > android/app/src/main/assets/index.html

      - name: Signaturschlüssel bereitstellen
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [ -n "$SIGNING_KEYSTORE" ]; then
            echo "$SIGNING_KEYSTORE" | base64 -d > "$RUNNER_TEMP/weightplan.jks"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/weightplan.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein fester Signaturschlüssel hinterlegt, Updates erfordern Neuinstallation."
            mkdir -p ~/.android
            [ -f ~/.android/debug.keystore ] || keytool -genkeypair -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -validity 10000 -dname "CN=Android Debug"
          fi

      - name: APKs bauen
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          gradle -p android assembleRelease --no-daemon
          gradle -p android-web assembleRelease --no-daemon

      - name: APKs umbenennen
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "Weightplan-3.${GITHUB_RUN_NUMBER}.apk"
          cp android-web/app/build/outputs/apk/release/app-release.apk "Weightplan-Web-2.${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Weightplan-apk
          path: Weightplan-*.apk

      - name: Als Release "latest" veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "Weightplan-3.${GITHUB_RUN_NUMBER}.apk" "Weightplan-Web-2.${GITHUB_RUN_NUMBER}.apk" \
            --title "Weightplan 3.${GITHUB_RUN_NUMBER} (Web 2.${GITHUB_RUN_NUMBER})" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Weightplan-3.x ist die eigenständige App, Weightplan-Web-2.x öffnet die claude.ai-Version. Anleitung in der README."
