name: Android-APK bauen

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "kurs.html"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: App-Seite in die APK legen
        run: |
          mkdir -p android/app/src/main/assets
          {
            printf '<!doctype html><html lang="de"><head><meta charset="utf-8">'
            printf '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">'
            printf '<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%%}[hidden]{display:none!important}</style>'
            printf '</head><body>'
            cat kurs.html
            printf '</body></html>'
          } > android/app/src/main/assets/index.html

      - name: APK bauen
        run: gradle -p android assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk Weightplan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Weightplan-apk
          path: Weightplan.apk

      - name: Als Release "latest" veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Weightplan.apk \
            --title "Weightplan (aktuelle APK)" \
            --notes "Automatisch gebaut aus ${GITHUB_SHA::7}. Auf dem Handy herunterladen und installieren, Anleitung in der README."
